kind = "mobile"
previewPath = "/mobile/"
title = "Gustafta Mobile"
description = "Native companion app for Gustafta PKB Assistant, serving construction professionals on-site. Mirrors the core flows — Gustafta competency interview, Competency Studio analysis, and PKB portfolio summary — with Clerk auth and real-time streaming chat backed by the same API server."
version = "1.0.0"
id = "artifacts/gustafta-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 23250

[services.development]
run = "pnpm --filter @workspace/gustafta-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gustafta-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/gustafta-mobile", "run", "serve" ]

[services.env]
PORT = "23250"
BASE_PATH = "/mobile/"
